services:
  backend:
    container_name: minv-tech-support-backend
    build:
      context: .
      dockerfile: Dockerfile
    image: minv-tech-support-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3001/",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
